# range-card CI — 백엔드는 lint→build→단위테스트→통합테스트(Testcontainers)를,
# 프론트엔드는 lint→test(Vitest)→build를 각각 순서대로 게이트한다. 두 job은 서로 독립이라 병렬 실행된다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 로컬 개발 버전(v24)에 맞춤 — backend/package.json의 engines.node와 일치.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - name: 단위 테스트 (Jest)
        run: npm test

      - name: 통합 테스트 (Testcontainers Postgres + supertest)
        # ubuntu-latest 러너에는 Docker가 기본 탑재되어 있어 Testcontainers가 별도 설정 없이 동작한다.
        run: npm run test:e2e

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - name: 단위 테스트 (Vitest — geo.ts/mortar.ts 순수함수)
        run: npm test

      - name: 타입체크 + 프로덕션 빌드
        run: npm run build
